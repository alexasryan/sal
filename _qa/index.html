<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка адаптивности SĀL</title><style>body{margin:0;font:14px Arial;background:#b8b8b8}header{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:20px;align-items:center;z-index:1}select{font:inherit;padding:8px}iframe{border:0;height:900px;display:block;margin:20px auto;background:#191b19}</style></head><body><header><label>Ширина <select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label><input type="checkbox" id="text"> Текст 200%</label></header><iframe title="Проверяемый сайт" src="../" width="390" id="preview"></iframe><script>const f=document.getElementById('preview');document.getElementById('width').onchange=e=>f.width=e.target.value;document.getElementById('text').onchange=e=>f.contentDocument.documentElement.style.fontSize=e.target.checked?'32px':'';</script></body></html>
