name: Production build and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and prerender
        run: npm run build
      - name: Validate forms, routes and assets
        run: npm test
      - name: Synchronize generated Pages snapshot
        run: npm run pages:sync
      - name: Commit generated files without overwriting concurrent work
        run: node scripts/commit-pages-snapshot.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify public pages and assets
        run: node scripts/verify-deployment.mjs
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false @playwright/test@1.58.2 @axe-core/playwright@4.13.0
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test published site in desktop and mobile browsers
        run: node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-qa
          path: qa-report/
          retention-days: 14
